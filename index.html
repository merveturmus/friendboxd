        async function showMovieSuggestions(query) {
    const box = document.getElementById("movieSuggestions");

    if (!query || query.length < 2) {
        box.innerHTML = "";
        return;
    }

    const url =
        `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&language=tr-TR`;

    const response = await fetch(url);
    const data = await response.json();

    if (!data.results || data.results.length === 0) {
        box.innerHTML = `
            <div class="text-xs text-gray-500">
                Film bulunamadı. İngilizce adıyla tekrar dene.
            </div>
        `;
        return;
    }

    box.innerHTML = data.results.slice(0, 5).map(movie => {
        const poster = movie.poster_path
            ? `https://image.tmdb.org/t/p/w92${movie.poster_path}`
            : "https://via.placeholder.com/60x90";

        const year = movie.release_date
            ? movie.release_date.slice(0, 4)
            : "Tarih yok";

        return `
            <button
                type="button"
                onclick='selectMovie(${JSON.stringify(movie).replace(/'/g, "&apos;")})'
                class="w-full flex gap-3 items-center bg-[#1f2937] hover:bg-[#263244] border border-gray-700 rounded-xl p-2 text-left cursor-pointer">

                <img src="${poster}" class="w-10 h-14 object-cover rounded">

                <div>
                    <div class="text-sm font-bold text-white">
                        ${escapeHTML(movie.title)}
                    </div>

                    <div class="text-xs text-gray-400">
                        ${escapeHTML(movie.original_title || "")} · ${year}
                    </div>
                </div>
            </button>
        `;
    }).join("");
}

function selectWatchlistMovie(movie) {

    document.getElementById("watchlistMovieSuggestions").innerHTML = "";
}
        async function getMovieData(movieName) {

    try {

        const url =
            `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(movieName)}&language=tr-TR`;

        const response = await fetch(url);

        const data = await response.json();

        if (
            data.results &&
            data.results.length > 0
        ) {

            return {
                id: data.results[0].id,
                title: data.results[0].title,
                original_title:
                    data.results[0].original_title,
                release_date:
                    data.results[0].release_date
            };
        }

        return null;

    } catch (error) {

        return null;
    }
}       
        async function getPoster(movieName) {

            if (posterCache[movieName]) {
                return posterCache[movieName];
            }

            try {
                const url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(movieName)}&language=tr-TR`;

                const response = await fetch(url);
                const data = await response.json();

                if (
                    data.results &&
                    data.results.length > 0 &&
                    data.results[0].poster_path
                ) {
                    const posterUrl =
                        `https://image.tmdb.org/t/p/w300${data.results[0].poster_path}`;

                    posterCache[movieName] = posterUrl;

                    return posterUrl;
                }

                return null;

            } catch (error) {
                return null;
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            const archiveBtn = document.getElementById("tab-archive");
            const watchlistBtn = document.getElementById("tab-watchlist");
            const archiveForm = document.getElementById("form-archive-container");
            const watchlistForm = document.getElementById("form-watchlist-container");
            const filterSec = document.getElementById("filter-section");
            
            if (tab === 'archive') {
                archiveBtn.classList.add("text-amber-500", "border-b-2", "border-amber-500");
                watchlistBtn.classList.remove("text-amber-500", "border-b-2", "border-amber-500");
                archiveForm.classList.remove("hidden");
                watchlistForm.classList.add("hidden");
                filterSec.classList.remove("hidden");
            } else {
                watchlistBtn.classList.add("text-amber-500", "border-b-2", "border-amber-500");
                archiveBtn.classList.remove("text-amber-500", "border-b-2", "border-amber-500");
                watchlistForm.classList.remove("hidden");
                archiveForm.classList.add("hidden");
                filterSec.classList.add("hidden");
            }
            loadData();
        }

        async function loadData() {
            const container = document.getElementById("listContainer");
            container.innerHTML = `<div class="text-center text-gray-500 text-sm py-8 animate-pulse">Yükleniyor...</div>`;
            
            if (currentTab === 'archive') {
                let { data: entries, error } = await supabaseClient.from('entries').select('*').order('created_at', { ascending: false });
                if (error) return;
                
                // Gruplama mantığı: İsimleri küçük harfe çevirip anahtar olarak kullan
                let movies = {};
                entries.forEach(entry => {
                    const mName = entry.movie_name.trim();
                    const mKey =
    entry.tmdb_id ||
    mName
        .trim()
        .toLowerCase()
        .replace(/\s+/g, ' ');
                    if (!movies[mKey]) movies[mKey] = { name: mName, reviews: [], totalRating: 0, latestDate: entry.created_at };
                    movies[mKey].reviews.push(entry);
                    movies[mKey].totalRating += Number(entry.rating);
                });

                let movieArray = Object.values(movies);
                movieArray.forEach(movie => {
                movie.averageRating = (
                movie.totalRating / movie.reviews.length
                ).toFixed(1);
                });

                const query = document.getElementById("searchBox").value.toLowerCase();

                movieArray = movieArray.filter(movie =>
                    movie.name.toLowerCase().includes(query)
                );
                if (currentSort === 'highest') movieArray.sort((a,b) => (b.totalRating/b.reviews.length) - (a.totalRating/a.reviews.length));
                else if (currentSort === 'lowest') movieArray.sort((a,b) => (a.totalRating/a.reviews.length) - (b.totalRating/b.reviews.length));
                else movieArray.sort((a,b) => new Date(b.latestDate) - new Date(a.latestDate));

                container.innerHTML = "";
                for (let movie of movieArray) {
                    const cardId = `movie-${btoa(encodeURIComponent(movie.name)).replace(/=/g, '')}`;
                    container.innerHTML += `
<div id="${cardId}" class="bg-[#111827] border border-gray-800 rounded-2xl p-5 flex flex-col md:flex-row gap-5 shadow-xl items-start">

    <div class="w-full md:w-32 flex-shrink-0">
        <div class="aspect-[2/3]">
            <img
                id="img-${cardId}"
                src="https://via.placeholder.com/150x225"
                class="w-full h-full object-cover rounded-xl bg-gray-800">
        </div>

        <div class="text-center mt-2 text-sm font-bold text-amber-400">
            ⭐ ${movie.averageRating}/10
        </div>
    </div>

    <div class="flex-1 w-full">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-extrabold text-white">${movie.name}</h3>

            <span class="text-xs font-bold bg-amber-600/20 text-amber-500 px-3 py-1 rounded-full">
                👁️ ${movie.reviews.length} izleyici
            </span>
        </div>

        <div class="space-y-3">
            ${movie.reviews.map(rev => `
                <div class="bg-[#192231]/40 border border-gray-800/40 rounded-xl p-3">

                    <div class="flex justify-between items-start text-xs mb-2">
                        <div class="flex gap-2 items-center">
                            <img
                                src="${rev.avatar_url || 'https://ui-avatars.com/api/?name=User&background=111827&color=fff'}"
                                class="w-6 h-6 rounded-full object-cover border border-gray-700">

                            <button
                                onclick="showProfile('${rev.user_id}')"
                                class="font-bold text-amber-400 hover:underline cursor-pointer">
                                ${escapeHTML(rev.username)}
                            </button>

                            <span class="font-black text-gray-300">
                                ⭐ ${rev.rating}
                            </span>
                        </div>

                        <span class="text-[10px] text-gray-500 shrink-0 ml-3">
                            ${formatDate(rev.created_at)}
                        </span>
                    </div>

                    ${rev.user_id === localStorage.getItem("sc_user_id") ? `
                        <div class="flex gap-2 mb-2">
                            <button
                                onclick="editEntry(${rev.id}, \`${rev.content.replace(/`/g, "\\`")}\`)"
                                class="text-blue-400 hover:text-blue-300 text-xs cursor-pointer">
                                ✏️
                            </button>

                            <button
                                onclick="deleteEntry(${rev.id})"
                                class="text-red-400 hover:text-red-300 text-xs cursor-pointer">
                                🗑️
                            </button>
                        </div>
                    ` : ""}

                    <p
                        class="${rev.is_spoiler ? 'spoiler-text' : ''}"
                        onclick="this.classList.toggle('spoiler-unblurred')">
                        ${escapeHTML(rev.content)}
                    </p>
                </div>
            `).join('')}
        </div>
    </div>
</div>`;
                    getPoster(movie.name).then(url => { if(url) document.getElementById(`img-${cardId}`).src = url; });
                }
            } else {
                let { data: watchlist } = await supabaseClient.from('watchlist').select('*').order('created_at', { ascending: false });
                watchlist.sort((a, b) => {

    if (!a.release_date) return 1;

    if (!b.release_date) return -1;

    return (
        new Date(a.release_date) -
        new Date(b.release_date)
    );
});
                container.innerHTML = `<div id="watch-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>`;
                const grid = document.getElementById("watch-grid");
                watchlist.forEach(item => {
                    const cardId = `watch-${item.id}`;
                    grid.innerHTML += `
                        <div class="relative group aspect-[2/3] rounded-lg overflow-hidden border border-gray-800 bg-gray-900">
                            <img id="img-${cardId}" src="https://via.placeholder.com/300x450" class="w-full h-full object-cover">
                            <div class="absolute bottom-0 left-0 right-0 bg-black/80 text-white text-xs px-2 py-2">
                              <div class="font-semibold">
                                  ${escapeHTML(item.username || "Anonim")}
                              </div>

                              <div class="text-[10px] text-gray-300 mt-1">

                               ${item.release_date
                               ? `📅 ${item.release_date}`
                               : "📅 Tarih bilinmiyor"}

                             </div>

                            </div>
                            <button onclick="removeFromWatchlist(${item.id})" class="absolute top-2 right-2 bg-black/50 text-white p-1 rounded-full text-xs">🗑️</button>
                        </div>`;
                    getPoster(item.movie_name).then(url => { if(url) document.getElementById(`img-${cardId}`).src = url; });
                });
            }
        }

        async function removeFromWatchlist(id) {
            await supabaseClient.from('watchlist').delete().eq('id', id);
            loadData();
        }

        function changeSort(sortType) {
            currentSort = sortType;

            const buttons = ['latest', 'highest', 'lowest'];

            buttons.forEach(type => {
                const btn = document.getElementById(`sort-${type}`);

                if (type === sortType) {
                    btn.classList.remove("bg-[#1f2937]", "text-gray-300");
                    btn.classList.add("bg-amber-600", "text-white");
                } else {
                    btn.classList.remove("bg-amber-600", "text-white");
                    btn.classList.add("bg-[#1f2937]", "text-gray-300");
                }
            });

            loadData();
        }
        async function deleteEntry(id) {

        const confirmed = confirm(
        "Bu yorumu silmek istediğine emin misin?"
    );

        if (!confirmed) return;

        const { error } = await supabaseClient
        .from('entries')
        .delete()
        .eq('id', id);

        if (error) {

        alert("Yorum silinemedi.");

        return;
    }

    loadData();
}
        async function editEntry(id, currentContent) {

    const newContent = prompt(
        "Yorumunu düzenle:",
        currentContent
    );

    if (
        !newContent ||
        newContent.trim() === ""
    ) return;

    const { error } = await supabaseClient
        .from('entries')
        .update({
            content: newContent
        })
        .eq('id', id);

    if (error) {

        alert(
            "Yorum güncellenemedi."
        );

        return;
    }

    loadData();

    } 
        async function showProfile(userId) {

    const profilePage =
        document.getElementById(
            "profilePage"
        );

    const listContainer =
        document.getElementById(
            "listContainer"
        );

    const { data: entries } =
        await supabaseClient
        .from('entries')
        .select('*')
        .eq('user_id', userId)
        .order('created_at', {
            ascending: false
        });

    if (!entries || entries.length === 0)
        return;

    const {
        data: watchlist
    } = await supabaseClient
        .from('watchlist')
        .select('*')
        .eq('user_id', userId);

    const username =
        entries[0].username;

    const totalReviews =
        entries.length;

    const averageRating =
        (
            entries.reduce(
                (sum, e) =>
                    sum + Number(e.rating),
                0
            ) / totalReviews
        ).toFixed(1);

    const topMovies =
        entries
        .sort((a, b) =>
            b.rating - a.rating
        )
        .slice(0, 3);

    listContainer.classList.add(
        "hidden"
    );

    profilePage.classList.remove(
        "hidden"
    );

    profilePage.innerHTML = `

<div class="bg-[#111827]
border border-gray-800
rounded-2xl p-6">

<button
onclick="closeProfile()"
class="mb-6 text-sm text-amber-400 hover:underline cursor-pointer">

← Geri Dön

</button>

<div class="flex items-center gap-4 mb-6">

<img
src="${entries[0].avatar_url || 'https://ui-avatars.com/api/?name=User&background=111827&color=fff'}"
class="w-20 h-20 rounded-full object-cover border-2 border-amber-500">

<div>

<h2 class="text-3xl font-black text-white">

${escapeHTML(username)}

</h2>

<p class="text-gray-400">

🎬 ${totalReviews} yorum

</p>

<p class="text-gray-400">

⭐ Ortalama:
${averageRating}

</p>

</div>

</div>

<div class="mb-8">

<h3 class="text-lg font-bold text-amber-500 mb-3">

🏆 En Sevdiği Filmler

</h3>

<div class="space-y-2">

${topMovies.map(movie => `

<div class="bg-[#1f2937]
rounded-xl p-3">

${escapeHTML(movie.movie_name)}
⭐ ${movie.rating}

</div>

`).join('')}

</div>

</div>

<div class="mb-8">

<h3 class="text-lg font-bold text-amber-500 mb-3">

⏳ Watchlist

</h3>

<div class="space-y-2">

${watchlist.map(movie => `

<div class="bg-[#1f2937]
rounded-xl p-3">

${escapeHTML(movie.movie_name)}

</div>

`).join('')}

</div>

</div>

<div>

<h3 class="text-lg font-bold text-amber-500 mb-3">

📝 Tüm Yorumları

</h3>

<div class="space-y-3">

${entries.map(entry => `

<div class="bg-[#1f2937]
rounded-xl p-4">

<div class="font-bold mb-2">

${escapeHTML(entry.movie_name)}
⭐ ${entry.rating}

</div>

<div class="text-gray-300">

${escapeHTML(entry.content)}

</div>

</div>

`).join('')}

</div>

</div>

</div>
`;
}

    function formatDate(dateString) {
    return new Date(dateString).toLocaleDateString("tr-TR", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
    });
}
        
function closeProfile() {

    document
        .getElementById(
            "profilePage"
        )
        .classList.add("hidden");

    document
        .getElementById(
            "listContainer"
        )
        .classList.remove("hidden");
}
    </script>
</body>
</html>
