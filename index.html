<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendboxd - Sinema Kulübü</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; }
        .spoiler-text { filter: blur(5px); cursor: pointer; transition: filter 0.3s; }
        .spoiler-text:hover { filter: blur(2px); }
        .spoiler-unblurred { filter: none !important; cursor: default; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen py-10 px-4 flex flex-col items-center">

    <div id="profileModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 hidden">
        <div class="bg-[#111827] border border-gray-800 rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl text-center">
            <h3 class="text-xl font-bold text-amber-500 mb-2">&#127916; Kulübe Hoş Geldin!</h3>
            <p class="text-gray-400 text-xs mb-6">Profilini bir defaya mahsus oluştur.</p>
            <form id="profileForm" class="space-y-4">
                <div>
                    <label class="block text-left text-xs font-bold uppercase tracking-wider text-gray-400 mb-1.5">İsminiz</label>
                    <input type="text" id="profileName" required placeholder="Örn: Merve" class="w-full bg-[#1f2937] border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-left text-xs font-bold uppercase tracking-wider text-gray-400 mb-1.5">Profil Fotoğrafı</label>
                    <input type="file" id="profileFile" required accept="image/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-600 file:text-white hover:file:bg-amber-500 file:cursor-pointer">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-sm cursor-pointer mt-2">Profili Kaydet ve Giriş Yap</button>
            </form>
        </div>
    </div>

    <div class="max-w-4xl w-full">
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center gap-4 border-b border-gray-800 pb-6">
            <div class="text-center md:text-left">
                <h1 class="text-4xl font-black tracking-wider text-amber-500 mb-1">FRIENDBOXD</h1>
                <p class="text-gray-400 text-sm">Gelişmiş Sinema Kulübü Platformu</p>
            </div>
            <div id="userBadge" class="hidden items-center gap-3 bg-[#111827] border border-gray-800 px-4 py-2 rounded-2xl">
                <img id="userBadgeImg" src="" class="w-8 h-8 rounded-full object-cover ring-2 ring-amber-500">
                <span id="userBadgeName" class="text-sm font-semibold text-gray-200"></span>
                <button onclick="clearProfile()" class="text-xs text-red-400 hover:underline ml-2 cursor-pointer">Değiştir</button>
            </div>
        </header>

        <div class="flex gap-4 border-b border-gray-800 mb-8 font-bold text-sm">
            <button id="tab-archive" onclick="switchTab('archive')" class="pb-3 text-amber-500 border-b-2 border-amber-500 px-2 cursor-pointer">&#127871; İzlenenler (Arşiv)</button>
            <button id="tab-watchlist" onclick="switchTab('watchlist')" class="pb-3 text-gray-400 hover:text-gray-200 px-2 cursor-pointer">&#8987; İzlenecekler (Watchlist)</button>
        </div>

        <section class="bg-[#111827] border border-gray-800 rounded-2xl p-6 shadow-2xl mb-8">
            <div id="form-archive-container">
                <h2 class="text-lg font-bold text-gray-200 mb-4 flex items-center gap-2">&#9997; Yeni Film Kritiği Ekle</h2>
                <form id="movieForm" class="space-y-4">
                    <div class="grid grid-cols-3 gap-4">
                        <div class="col-span-2">
                            <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1.5">Film Adı (İngilizce)</label>
                            <input type="text" id="movieName" required placeholder="Örn: Inception" class="w-full bg-[#1f2937] border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1.5">Puan (1-10)</label>
                            <input type="number" id="rating" required min="1" max="10" placeholder="10" class="w-full bg-[#1f2937] border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white text-center focus:outline-none focus:border-amber-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1.5">Film Hakkındaki Düşünceleriniz</label>
                        <textarea id="content" required rows="2" placeholder="Film hakkında kısa bir entry bırakın..." class="w-full bg-[#1f2937] border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white resize-none focus:outline-none focus:border-amber-500"></textarea>
                    </div>
                    <div class="flex items-center gap-2">
                        <input type="checkbox" id="isSpoiler" class="w-4 h-4 rounded border-gray-700 bg-[#1f2937] text-amber-500 focus:ring-0 cursor-pointer">
                        <label for="isSpoiler" class="text-xs font-semibold text-red-400 cursor-pointer select-none">&#9888; Bu entry ağır spoiler içerir!</label>
                    </div>
                    <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-4 rounded-xl transition text-sm cursor-pointer shadow-lg">Kritiği Gönder</button>
                </form>
            </div>

            <div id="form-watchlist-container" class="hidden">
                <h2 class="text-lg font-bold text-gray-200 mb-4 flex items-center gap-2">&#8987; İzleme Listesine Film Ekle</h2>
                <form id="watchlistForm" class="flex gap-3">
                    <input type="text" id="watchlistMovieName" required placeholder="İzlemek istediğiniz filmin adı..." class="flex-1 bg-[#1f2937] border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
                    <button type="submit" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-6 py-2.5 rounded-xl text-sm cursor-pointer transition">Listeye Ekle</button>
                </form>
            </div>
        </section>

        <section id="filter-section" class="mb-6 bg-[#111827]/50 border border-gray-800 rounded-xl p-4 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:w-72">
                <input type="text" id="searchBox" placeholder="Film adı ara..." class="w-full bg-[#1f2937] border border-gray-700 rounded-xl pl-4 pr-10 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                <span class="absolute right-3 top-2.5 text-gray-500">&#128269;</span>
            </div>
            <div class="flex gap-2 w-full md:w-auto justify-end">
                <button onclick="changeSort('latest')" id="sort-latest" class="bg-amber-600 text-white text-xs font-semibold px-3 py-2 rounded-lg cursor-pointer">🕒 En Yeni</button>
                <button onclick="changeSort('highest')" id="sort-highest" class="bg-[#1f2937] text-gray-300 text-xs font-semibold px-3 py-2 rounded-lg cursor-pointer">⭐ En Yüksek</button>
                <button onclick="changeSort('lowest')" id="sort-lowest" class="bg-[#1f2937] text-gray-300 text-xs font-semibold px-3 py-2 rounded-lg cursor-pointer">📉 En Düşük</button>
            </div>
        </section>

        <section>
            <div id="listContainer" class="space-y-6"></div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://mazidhvusmbzekytbezl.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1hemlkaHZ1c21iemVreXRiZXpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTg5NzUsImV4cCI6MjA5NDY3NDk3NX0.fyT0nUs8ynkTVef5WTHBprs50IeSP5tj6lKJfkEIYzM";
        const OMDB_API_KEY = "388bb0fc";

        let supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentTab = 'archive';
        let currentSort = 'latest';

        document.addEventListener("DOMContentLoaded", () => {
            checkProfile();
            loadData();
        });

        function checkProfile() {
            const name = localStorage.getItem("sc_name");
            const avatar = localStorage.getItem("sc_avatar");
            if (!name || !avatar) {
                document.getElementById("profileModal").classList.remove("hidden");
            } else {
                document.getElementById("userBadgeName").innerText = name;
                document.getElementById("userBadgeImg").src = avatar;
                document.getElementById("userBadge").classList.remove("hidden");
                document.getElementById("userBadge").classList.add("flex");
            }
        }

        document.getElementById("profileForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("profileName").value.trim();
            const file = document.getElementById("profileFile").files[0];
            if (name && file) {
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}.${fileExt}`;
                const { data, error } = await supabaseClient.storage.from('avatars').upload(fileName, file);
                if (error) return alert("Fotoğraf yüklenemedi: " + error.message);
                const { data: urlData } = supabaseClient.storage.from('avatars').getPublicUrl(fileName);
                localStorage.setItem("sc_name", name);
                localStorage.setItem("sc_avatar", urlData.publicUrl);
                document.getElementById("profileModal").classList.add("hidden");
                checkProfile();
                location.reload();
            }
        });

        function clearProfile() {
            localStorage.clear();
            location.reload();
        }
const TMDB_API_KEY = "BURAYA_KENDİ_KEYİNİZİ_YAZIN";

async function getPoster(movieName) {
    try {
        // TMDB'de film arama
        const url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(movieName)}&language=tr-TR`;
        const response = await fetch(url);
        const data = await response.json();

        // Eğer film bulunduysa ilk sonucu dön
        if (data.results && data.results.length > 0 && data.results[0].poster_path) {
            return `https://image.tmdb.org/t/p/w300${data.results[0].poster_path}`;
        }
        return null; // Film bulunamadıysa null dön
    } catch (error) {
        console.error("Poster çekme hatası:", error);
        return null;
    }
}
        
        function switchTab(tab) {
            currentTab = tab;
            const archiveBtn = document.getElementById("tab-archive");
            const watchlistBtn = document.getElementById("tab-watchlist");
            const archiveForm = document.getElementById("form-archive-container");
            const watchlistForm = document.getElementById("form-watchlist-container");
            const filterSec = document.getElementById("filter-section");
            if (tab === 'archive') {
                archiveBtn.className = "pb-3 text-amber-500 border-b-2 border-amber-500 px-2 cursor-pointer";
                watchlistBtn.className = "pb-3 text-gray-400 hover:text-gray-200 px-2 cursor-pointer";
                archiveForm.classList.remove("hidden");
                watchlistForm.classList.add("hidden");
                filterSec.classList.remove("hidden");
            } else {
                watchlistBtn.className = "pb-3 text-amber-500 border-b-2 border-amber-500 px-2 cursor-pointer";
                archiveBtn.className = "pb-3 text-gray-400 hover:text-gray-200 px-2 cursor-pointer";
                watchlistForm.classList.remove("hidden");
                archiveForm.classList.add("hidden");
                filterSec.classList.add("hidden");
            }
            loadData();
        }

        async function loadData() {
            const container = document.getElementById("listContainer");
            container.innerHTML = `<div class="text-center text-gray-500 text-sm py-8 animate-pulse">Sinema kulübü verileri yükleniyor...</div>`;
            
            if (currentTab === 'archive') {
                let { data: entries, error } = await supabaseClient.from('entries').select('*').order('created_at', { ascending: false });
                if (error) return console.error(error);
                let movies = {};
                entries.forEach(entry => {
                    const mName = entry.movie_name.trim();
                    if (!movies[mName]) {
                        movies[mName] = { name: mName, reviews: [], totalRating: 0, latestDate: entry.created_at };
                    }
                    movies[mName].reviews.push(entry);
                    movies[mName].totalRating += entry.rating;
                });
                let movieArray = Object.values(movies);
                if (currentSort === 'highest') {
                    movieArray.sort((a,b) => (b.totalRating/b.reviews.length) - (a.totalRating/a.reviews.length));
                } else if (currentSort === 'lowest') {
                    movieArray.sort((a,b) => (a.totalRating/a.reviews.length) - (b.totalRating/b.reviews.length));
                } else {
                    movieArray.sort((a,b) => new Date(b.latestDate) - new Date(a.latestDate));
                }
                if (movieArray.length === 0) {
                    container.innerHTML = `<div class="text-center text-gray-500 text-sm py-8">Henüz kritik eklenmemiş. İlk kritiği yukarıdan gönderin!</div>`;
                    return;
                }
                container.innerHTML = "";
                for (let movie of movieArray) {
                    const avg = (movie.totalRating / movie.reviews.length).toFixed(1);
                    const watcherCount = movie.reviews.length;
                    const cardId = `movie-${btoa(encodeURIComponent(movie.name)).replace(/=/g, '')}`;
                    let cardHTML = `<div id="${cardId}" class="bg-[#111827] border border-gray-800 rounded-2xl p-5 flex flex-col md:flex-row gap-5 shadow-xl">
                            <img id="img-${cardId}" src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=300" class="w-full md:w-32 h-48 md:h-auto object-cover rounded-xl bg-gray-800 flex-shrink-0">
                            <div class="flex-1 flex flex-col justify-between">
                                <div>
                                    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                                        <h3 class="text-xl font-extrabold text-white tracking-wide">${movie.name}</h3>
                                        <div class="flex items-center gap-3">
                                            <span class="text-xs bg-amber-500/10 text-amber-400 font-bold border border-amber-500/20 px-2 py-1 rounded-lg flex items-center gap-1">👥 ${watcherCount} İzleyici</span>
                                            <span class="text-sm bg-emerald-600 text-white font-black px-3 py-1 rounded-xl">⭐ ${avg}/10</span>
                                        </div>
                                    </div>
                                    <p id="meta-${cardId}" class="text-xs text-gray-400 mb-4 font-semibold">Veriler yükleniyor...</p>
                                    <div class="space-y-3 border-t border-gray-800/60 pt-3 max-h-60 overflow-y-auto pr-1">`;
                    movie.reviews.forEach(rev => {
                        const isBlured = rev.is_spoiler ? 'spoiler-text' : '';
                        const spoilerAlert = rev.is_spoiler ? '<span class="text-[10px] bg-red-900/40 text-red-400 border border-red-800/30 px-1.5 py-0.5 rounded mr-1">SPOILER</span>' : '';
                        cardHTML += `
                            <div class="bg-[#192231]/40 border border-gray-800/40 rounded-xl p-3 flex gap-3 items-start">
                                <img src="${rev.avatar_url}" class="w-7 h-7 rounded-full object-cover ring-1 ring-amber-500/30 flex-shrink-0">
                                <div class="flex-1">
                                    <div class="flex items-center justify-between mb-1">
                                        <span class="text-xs font-bold text-amber-400">${rev.username}</span>
                                        <span class="text-xs bg-gray-800 px-1.5 py-0.5 rounded font-black text-gray-300">⭐ ${rev.rating}</span>
                                    </div>
                                    <p class="text-sm text-gray-300 leading-relaxed ${isBlured}" onclick="this.classList.remove('spoiler-text')">${spoilerAlert}${rev.content}</p>
                                </div>
                            </div>`;
                    });
                    cardHTML += `</div></div></div>`;
                    container.innerHTML += cardHTML;
                    fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(movie.name)}&apikey=${OMDB_API_KEY}`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.Response === "True") {
                                if (data.Poster && data.Poster !== "N/A") document.getElementById(`img-${cardId}`).src = data.Poster;
                                document.getElementById(`meta-${cardId}`).innerText = `📅 Vizyon: ${data.Released}  •  🎬 Tür: ${data.Genre}  •  🎥 Yönetmen: ${data.Director}`;
                            } else {
                                document.getElementById(`meta-${cardId}`).innerText = "Film detayları bulunamadı.";
                            }
                        });
                }
            } else {
                let { data: watchlist, error } = await supabaseClient.from('watchlist').select('*').order('created_at', { ascending: false });
                if (error) return console.error(error);
                if (watchlist.length === 0) {
                    container.innerHTML = `<div class="text-center text-gray-500 text-sm py-8">İzleme listeniz şu an boş.</div>`;
                    return;
                }
                container.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">`;
                const grid = document.createElement("div");
            grid.className = "grid grid-cols-1 sm:grid-cols-2 gap-4";
            container.appendChild(grid);

            watchlist.forEach(item => {
                const cardId = `watch-${item.id}`;
                grid.innerHTML += `
                    <div id="${cardId}" class="bg-[#111827] border border-gray-800 rounded-xl p-4 flex gap-4 shadow-md">
                        <img id="img-${cardId}" src="https://via.placeholder.com/100x150?text=Film" class="w-20 h-28 object-cover rounded-lg bg-gray-800">
                        <div class="flex-1">
                            <h4 class="font-bold text-gray-200 capitalize">${item.movie_name}</h4>
                            <p class="text-[10px] text-gray-500 mt-1">⏳ ${new Date(item.created_at).toLocaleDateString('tr-TR')}</p>
                            <button onclick="removeFromWatchlist(${item.id})" class="mt-3 text-xs bg-red-950 hover:bg-red-900 border border-red-900/30 text-red-400 px-3 py-1.5 rounded-lg cursor-pointer transition">Sil</button>
                        </div>
                    </div>`;
                
                fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(item.movie_name)}&apikey=${OMDB_API_KEY}`)
                    .then(r => r.json()).then(d => { 
                        if(d.Response === "True" && d.Poster && d.Poster !== "N/A") {
                            document.getElementById(`img-${cardId}`).src = d.Poster; 
                        }
                    });
            });
                container.innerHTML += `</div>`;
            }
        }

        document.getElementById("movieForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("movieName").value.trim().toLowerCase();
            const rating = parseInt(document.getElementById("rating").value);
            const content = document.getElementById("content").value.trim();
            const isSpoiler = document.getElementById("isSpoiler").checked;
            const uName = localStorage.getItem("sc_name");
            const uAvatar = localStorage.getItem("sc_avatar");
            const { error } = await supabaseClient.from('entries').insert([{ movie_name: name, rating: rating, content: content, username: uName, avatar_url: uAvatar, is_spoiler: isSpoiler }]);
            if (error) alert("Kritik kaydedilemedi: " + error.message);
            else { document.getElementById("movieForm").reset(); loadData(); }
        });

        document.getElementById("watchlistForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("watchlistMovieName").value.trim().toLowerCase();
            const { error } = await supabaseClient.from('watchlist').insert([{ movie_name: name }]);
            if (error) alert("Listeye eklenemedi: " + error.message);
            else { 
                document.getElementById("watchlistForm").reset(); 
                loadData(); 
            }
        });

        async function removeFromWatchlist(id) {
            const { error } = await supabaseClient.from('watchlist').delete().eq('id', id);
            if (error) alert("Silme başarısız: " + error.message);
            else loadData();
        }

        function changeSort(sortType) {
            currentSort = sortType;
            ['latest', 'highest', 'lowest'].forEach(t => {
                const btn = document.getElementById(`sort-${t}`);
                if (btn) {
                    btn.className = (t === sortType) ? "bg-amber-600 text-white text-xs font-semibold px-3 py-2 rounded-lg cursor-pointer" : "bg-[#1f2937] text-gray-300 text-xs font-semibold px-3 py-2 rounded-lg cursor-pointer";
                }
            });
            loadData();
        }
    </script>
</body>
</html>
